<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mailgate</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #eaecf4;
      height: 100vh;
      overflow: hidden;
      color: #2d3748;
    }

    /* ── Redirect mode ─────────────────────────────────── */

    #mode-redirect {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .redirect-window {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(100, 120, 200, 0.12);
      width: 100%;
      max-width: 560px;
      overflow: hidden;
    }

    .redirect-header {
      background: #404040;
      color: #fff;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .redirect-body {
      padding: 20px;
    }

    .status-text {
      font-size: 14px;
      color: #555;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .mailto-link-section {
      margin-bottom: 20px;
    }

    .mailto-link-section p {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }

    .btn-primary {
      display: inline-block;
      background: #6b84cc;
      color: #fff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s;
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover { background: #5470b8; }

    .debug-section {
      border-top: 1px solid #eaecf4;
      padding-top: 16px;
    }

    .debug-section h3 {
      font-size: 11px;
      color: #999;
      font-weight: 500;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .debug-empty {
      font-size: 12px;
      color: #bbb;
      font-style: italic;
    }

    .debug-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .debug-table th {
      text-align: left;
      color: #999;
      font-weight: 500;
      padding: 4px 8px 4px 0;
      border-bottom: 1px solid #eaecf4;
    }

    .debug-table td {
      padding: 5px 8px 5px 0;
      color: #444;
      border-bottom: 1px solid #f5f5f5;
      word-break: break-all;
    }

    .debug-table td:first-child {
      font-family: 'Courier New', monospace;
      color: #c2185b;
      white-space: nowrap;
      padding-right: 12px;
    }

    .debug-table td:nth-child(2) {
      color: #999;
      padding-right: 12px;
    }

    /* ── Builder mode ──────────────────────────────────── */

    #mode-builder {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: hidden;
    }

    .builder-page {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }

    .restore-input {
      flex: 1;
      min-width: 0;
      border: 1px solid #d8dcea;
      border-radius: 5px;
      padding: 5px 10px;
      font-size: 12px;
      font-family: inherit;
      color: #2d3748;
      outline: none;
      transition: border-color 0.15s;
      background: #fff;
    }

    .restore-input::placeholder { color: #b0b8d4; }
    .restore-input:focus { border-color: #6b84cc; }

    .restore-btn {
      flex-shrink: 0;
      background: #6b84cc;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .restore-btn:hover { background: #5470b8; }

    /* Builder two-column layout */
    .builder-layout {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 16px;
    }

    .builder-main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* Compose window */
    .compose-window {
      flex: 1;
      min-height: 0;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(100, 120, 200, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .compose-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #eaecf4;
      flex-shrink: 0;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-red    { background: #ff5f57; }
    .dot-yellow { background: #febc2e; }
    .dot-green  { background: #28c840; }

    .compose-title {
      font-size: 14px;
      font-weight: 600;
      color: #4c5f8e;
      margin-left: 4px;
    }

    .field-row {
      display: flex;
      align-items: flex-start;
      padding: 13px 20px;
      border-bottom: 1px solid #eaecf4;
    }

    .field-row label {
      width: 52px;
      font-size: 14px;
      font-weight: 700;
      color: #4c5f8e;
      flex-shrink: 0;
      padding-top: 1px;
    }

    .field-row input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      color: #2d3748;
      background: transparent;
    }

    .field-row input::placeholder { color: #b0b8d4; }

    .body-area {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 14px 20px;
      border-bottom: 1px solid #eaecf4;
    }

    .body-area textarea {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      color: #2d3748;
      resize: none;
      background: transparent;
      line-height: 1.6;
    }

    .body-area textarea::placeholder { color: #b0b8d4; }

    /* URL bar at bottom of compose */
    .url-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
    }

    .url-text {
      flex: 1;
      font-size: 12px;
      color: #6b84cc;
      font-family: 'Courier New', monospace;
      word-break: break-all;
      line-height: 1.6;
      min-height: 18px;
    }

    .url-text.empty {
      color: #b0b8d4;
      font-family: inherit;
      font-size: 13px;
    }

    .copy-btn {
      flex-shrink: 0;
      background: transparent;
      color: #6b84cc;
      border: 1.5px solid #6b84cc;
      border-radius: 6px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }

    .copy-btn:hover {
      background: #6b84cc;
      color: #fff;
    }

    .copy-btn.copied {
      background: #48bb78;
      border-color: #48bb78;
      color: #fff;
    }

    /* Variables panel */
    .vars-panel {
      width: 256px;
      flex-shrink: 0;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(100, 120, 200, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .vars-panel-header {
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #4c5f8e;
      border-bottom: 1px solid #eaecf4;
      flex-shrink: 0;
    }

    .vars-body {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 8px;
    }

    .var-group {
      padding: 10px 16px;
      border-bottom: 1px solid #f3f4f8;
    }

    .var-group:last-child { border-bottom: none; }

    .var-keyword {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #c2185b;
      margin-bottom: 2px;
    }

    .var-desc {
      font-size: 11px;
      color: #9aa5c4;
      margin-bottom: 7px;
    }

    .var-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .var-chip {
      font-family: 'Courier New', monospace;
      font-size: 10.5px;
      background: #f3f4f8;
      color: #4c5f8e;
      border: 1px solid #dde0ee;
      border-radius: 4px;
      padding: 3px 7px;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
      white-space: nowrap;
      line-height: 1.4;
    }

    .var-chip:hover {
      background: #e8edf8;
      border-color: #6b84cc;
      color: #3a56a8;
    }

    .var-chip-preview {
      display: block;
      font-family: inherit;
      font-size: 9.5px;
      color: #9aa5c4;
      margin-top: 1px;
    }

    .token-section {
      padding: 10px 16px 12px;
      border-top: 1px solid #eaecf4;
    }

    .token-section-label {
      font-size: 11px;
      font-weight: 600;
      color: #9aa5c4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .token-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 3px 10px;
      font-size: 11px;
    }

    .token-key {
      font-family: 'Courier New', monospace;
      color: #c2185b;
      white-space: nowrap;
    }

    .token-val { color: #7a87a8; }

    /* Custom params section */
    .vars-section {
      border-bottom: 1px solid #eaecf4;
      padding-bottom: 10px;
    }

    .vars-section-label {
      font-size: 11px;
      font-weight: 600;
      color: #9aa5c4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 16px 6px;
    }

    .custom-param-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 16px;
    }

    .custom-param-arrow { font-size: 11px; color: #b0b8d4; }

    .custom-param-val {
      flex: 1;
      font-size: 11px;
      color: #4c5f8e;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .custom-param-del {
      flex-shrink: 0;
      background: none;
      border: none;
      color: #b0b8d4;
      cursor: pointer;
      font-size: 13px;
      padding: 0 2px;
      line-height: 1;
    }

    .custom-param-del:hover { color: #e57373; }

    .add-param-row {
      display: flex;
      gap: 5px;
      padding: 6px 16px 4px;
    }

    .add-param-input {
      flex: 1;
      min-width: 0;
      border: 1px solid #d8dcea;
      border-radius: 4px;
      padding: 4px 7px;
      font-size: 11px;
      font-family: inherit;
      color: #2d3748;
      outline: none;
      background: #fff;
    }

    .add-param-input:focus { border-color: #6b84cc; }
    .add-param-input::placeholder { color: #c8d0e4; }

    .add-param-btn {
      flex-shrink: 0;
      background: #6b84cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .add-param-btn:hover { background: #5470b8; }

    /* Responsive */
    @media (max-width: 700px) {
      body { height: auto; overflow: auto; }
      #mode-builder { height: auto; overflow: visible; }
      .builder-page { flex: none; }
      .builder-layout { flex: none; flex-direction: column; }
      .vars-panel { width: 100%; }
      .vars-body { max-height: 320px; }
      .body-area textarea { min-height: 120px; }
    }
  </style>
</head>
<body>

  <!-- ── Redirect mode ────────────────────────────────────────── -->
  <div id="mode-redirect" style="display:none">
    <div class="redirect-window">
      <div class="redirect-header">
        <div class="spinner"></div>
        <span>メールを開いています…</span>
      </div>
      <div class="redirect-body">
        <p class="status-text">メールクライアントを起動しています。自動的に開かない場合は下のボタンをクリックしてください。</p>
        <div class="mailto-link-section">
          <p>自動で開かない場合：</p>
          <a id="mailto-btn" href="#" class="btn-primary">メールを開く</a>
        </div>
        <div class="debug-section">
          <h3>日付プレースホルダーの置換結果</h3>
          <div id="debug-output"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Builder mode ─────────────────────────────────────────── -->
  <div id="mode-builder" style="display:none">
    <div class="builder-page">

      <div class="builder-layout">

        <!-- Main column -->
        <div class="builder-main">
          <div class="compose-window">
            <div class="compose-header">
              <span class="dot dot-red"></span>
              <span class="dot dot-yellow"></span>
              <span class="dot dot-green"></span>
              <span class="compose-title">新規メール</span>
              <input id="restore-input" class="restore-input" type="text"
                placeholder="mailtoリンクを貼り付けて復元" autocomplete="off" spellcheck="false">
              <button class="restore-btn" onclick="restoreFromLink()">復元</button>
            </div>
            <div class="field-row">
              <label for="f-to">To</label>
              <input id="f-to" type="text" placeholder="宛先（改行で複数可）" autocomplete="off" spellcheck="false">
            </div>
            <div class="field-row">
              <label for="f-cc">Cc</label>
              <input id="f-cc" type="text" placeholder="（改行で複数可）" autocomplete="off" spellcheck="false">
            </div>
            <div class="field-row">
              <label for="f-bcc">Bcc</label>
              <input id="f-bcc" type="text" placeholder="（改行で複数可）" autocomplete="off" spellcheck="false">
            </div>
            <div class="field-row">
              <label for="f-subject">件名</label>
              <input id="f-subject" type="text" placeholder="件名" autocomplete="off" spellcheck="false">
            </div>
            <div class="body-area">
              <textarea id="f-body" placeholder="本文を入力してください…" spellcheck="false"></textarea>
            </div>
            <div class="url-bar">
              <span id="generated-url" class="url-text empty">入力するとリンクが自動生成されます</span>
              <button id="copy-btn" class="copy-btn" onclick="copyUrl()">コピー</button>
            </div>
          </div>
        </div>

        <!-- Right column -->
        <div class="vars-panel">
          <div class="vars-panel-header">変数パネル</div>
          <div class="vars-body">
            <div class="vars-section">
              <div class="vars-section-label">カスタム変数</div>
              <div id="custom-params-list"></div>
              <div class="add-param-row">
                <input id="param-key" class="add-param-input" placeholder="変数名" autocomplete="off" spellcheck="false">
                <input id="param-val" class="add-param-input" placeholder="値" autocomplete="off" spellcheck="false">
                <button class="add-param-btn" onclick="addCustomParam()">追加</button>
              </div>
            </div>
            <div id="vars-date-body"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    /* ── Date utilities ──────────────────────────────────────── */

    function formatDate(date, fmt) {
      const yyyy = date.getFullYear();
      const yy = String(yyyy).slice(-2);
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const m = date.getMonth() + 1;
      const dd = String(date.getDate()).padStart(2, '0');
      const d = date.getDate();
      const HH = String(date.getHours()).padStart(2, '0');
      const H = date.getHours();
      const MM = String(date.getMinutes()).padStart(2, '0');
      const M = date.getMinutes();
      const SS = String(date.getSeconds()).padStart(2, '0');
      const S = date.getSeconds();
      const dow = date.getDay();
      const dowEn     = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const dowShEn   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const dowJaFull = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
      const dowJa     = ['日','月','火','水','木','金','土'];
      return fmt
        .replace(/dddd/g, dowEn[dow])
        .replace(/ddd/g,  dowShEn[dow])
        .replace(/aaaa/g, dowJaFull[dow])
        .replace(/aaa/g,  dowJa[dow])
        .replace(/yyyy/g, yyyy)
        .replace(/yy/g,   yy)
        .replace(/mm/g,   mm)
        .replace(/dd/g,   dd)
        .replace(/HH/g,   HH)
        .replace(/MM/g,   MM)
        .replace(/SS/g,   SS)
        .replace(/m/g,    m)
        .replace(/d/g,    d)
        .replace(/H/g,    H)
        .replace(/M/g,    M)
        .replace(/S/g,    S);
    }

    function getDateMap() {
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);
      return {
        today,
        yesterday,
        tomorrow:  new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1),
        lastmonth: new Date(today.getFullYear(), today.getMonth() - 1, 1),
        nextmonth: new Date(today.getFullYear(), today.getMonth() + 1, 1),
      };
    }

    function getWorkday(today, offset) {
      const d = new Date(today);
      if (offset === 0) {
        while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
        return d;
      }
      const step = offset > 0 ? 1 : -1;
      let remaining = Math.abs(offset);
      while (remaining > 0) {
        d.setDate(d.getDate() + step);
        if (d.getDay() !== 0 && d.getDay() !== 6) remaining--;
      }
      return d;
    }

    function replaceDatePlaceholders(text) {
      const dm = getDateMap();
      return text
        .replace(/\[today\((.+?)\)\]/g,     (_, fmt) => formatDate(dm.today,     fmt))
        .replace(/\[yesterday\((.+?)\)\]/g,  (_, fmt) => formatDate(dm.yesterday, fmt))
        .replace(/\[tomorrow\((.+?)\)\]/g,   (_, fmt) => formatDate(dm.tomorrow,  fmt))
        .replace(/\[lastmonth\((.+?)\)\]/g,  (_, fmt) => formatDate(dm.lastmonth, fmt))
        .replace(/\[nextmonth\((.+?)\)\]/g,  (_, fmt) => formatDate(dm.nextmonth, fmt))
        .replace(/\[workday\(([+-]?\d+),\s*(.+?)\)\]/g,
          (_, n, fmt) => formatDate(getWorkday(dm.today, parseInt(n)), fmt));
    }

    function encodeSpecialChars(str) {
      return str.replace(/[%&=#?]|\r\n|\r|\n/g, c => encodeURIComponent(c));
    }

    function encodeQueryValue(str) {
      return str.replace(/[%&=#?+]|\r\n|\r|\n/g, c => encodeURIComponent(c));
    }

    /* ── Redirect mode ───────────────────────────────────────── */

    function collectPlaceholders(text) {
      const found = [];
      const pattern = /\[(today|yesterday|tomorrow|lastmonth|nextmonth)\((.+?)\)\]/g;
      let match;
      while ((match = pattern.exec(text)) !== null) {
        found.push({ type: 'date', placeholder: match[0], keyword: match[1], fmt: match[2] });
      }
      const wdPattern = /\[workday\(([+-]?\d+),\s*(.+?)\)\]/g;
      while ((match = wdPattern.exec(text)) !== null) {
        found.push({ type: 'workday', placeholder: match[0], offset: parseInt(match[1]), fmt: match[2] });
      }
      return found;
    }

    function buildDebugInfo(rawParams, urlParams) {
      const allText = Object.values(rawParams).join('\n');
      const dateFound = collectPlaceholders(allText);
      const paramFound = [...allText.matchAll(/\[param:([^\]]+)\]/g)]
        .map(m => ({ placeholder: m[0], key: m[1] }));
      const debugEl = document.getElementById('debug-output');

      if (dateFound.length === 0 && paramFound.length === 0) {
        debugEl.innerHTML = '<p class="debug-empty">プレースホルダーは使用されていません</p>';
        return;
      }

      const dm = getDateMap();
      const dateRows = dateFound.map(({ type, placeholder, keyword, fmt, offset }) => {
        const date = type === 'workday' ? getWorkday(dm.today, offset) : dm[keyword];
        const resolved = formatDate(date, fmt);
        const esc = placeholder.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<tr><td>${esc}</td><td>→</td><td>${resolved}</td></tr>`;
      }).join('');

      const paramRows = paramFound.map(({ placeholder, key }) => {
        const resolved = urlParams.get(key) ?? '(未設定)';
        const esc = placeholder.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<tr><td>${esc}</td><td>→</td><td>${resolved}</td></tr>`;
      }).join('');

      debugEl.innerHTML = `
        <table class="debug-table">
          <thead><tr><th>プレースホルダー</th><th></th><th>置換後の値</th></tr></thead>
          <tbody>${dateRows}${paramRows}</tbody>
        </table>`;
    }

    function replaceParamPlaceholders(text, params) {
      return text.replace(/\[param:([^\]]+)\]/g, (_, key) => params.get(key) ?? '');
    }

    function runRedirectMode(params) {
      const rawParams = {
        to:      params.get('to')      ?? '',
        cc:      params.get('cc')      ?? '',
        bcc:     params.get('bcc')     ?? '',
        subject: params.get('subject') ?? '',
        body:    params.get('body')    ?? '',
      };

      buildDebugInfo(rawParams, params);

      const applyAll = str => replaceParamPlaceholders(replaceDatePlaceholders(str), params);
      const to      = applyAll(rawParams.to);
      const cc      = applyAll(rawParams.cc);
      const bcc     = applyAll(rawParams.bcc);
      const subject = applyAll(rawParams.subject);
      const body    = applyAll(rawParams.body);

      const queryParts = [];
      if (cc)      queryParts.push('cc='      + encodeSpecialChars(cc));
      if (bcc)     queryParts.push('bcc='     + encodeSpecialChars(bcc));
      if (subject) queryParts.push('subject=' + encodeSpecialChars(subject));
      if (body)    queryParts.push('body='    + encodeSpecialChars(body));

      const mailtoUrl = 'mailto:' + encodeSpecialChars(to)
        + (queryParts.length ? '?' + queryParts.join('&') : '');

      document.getElementById('mailto-btn').href = mailtoUrl;
      document.getElementById('mode-redirect').style.display = 'flex';

      window.location.href = mailtoUrl;
      setTimeout(() => window.close(), 500);
    }

    /* ── Builder mode ────────────────────────────────────────── */

    const VAR_GROUPS = [
      {
        keyword: 'today',
        desc: '今日の日付',
        examples: ['yyyy/mm/dd', 'yyyy年m月d日', 'yyyy年m月d日(aaa)', 'mm/dd(aaa)', 'aaaa', 'ddd'],
      },
      {
        keyword: 'yesterday',
        desc: '前日（月曜の場合は金曜）',
        examples: ['yyyy/mm/dd', 'mm/dd', 'm月d日(aaa)'],
      },
      {
        keyword: 'tomorrow',
        desc: '翌日',
        examples: ['yyyy/mm/dd', 'mm/dd', 'm月d日(aaa)'],
      },
      {
        keyword: 'lastmonth',
        desc: '先月1日',
        examples: ['yyyy/mm', 'yyyy年m月', 'yyyymm'],
      },
      {
        keyword: 'nextmonth',
        desc: '来月1日',
        examples: ['yyyy/mm', 'yyyy年m月', 'yyyymm'],
      },
    ];

    const TOKENS = [
      ['yyyy', '年4桁'],  ['yy',   '年下2桁'],
      ['mm',   '月(ゼロ埋め)'], ['m', '月'],
      ['dd',   '日(ゼロ埋め)'], ['d', '日'],
      ['dddd', '曜日(英語フル)'], ['ddd', '曜日(英語略)'],
      ['aaaa', '曜日(日本語フル)'], ['aaa', '曜日(日本語)'],
      ['HH',   '時(ゼロ埋め)'], ['H', '時'],
      ['MM',   '分(ゼロ埋め)'], ['M', '分'],
      ['SS',   '秒(ゼロ埋め)'], ['S', '秒'],
    ];

    function buildVarsPanel() {
      const dm = getDateMap();
      const container = document.getElementById('vars-date-body');
      renderCustomParams();

      const workdayExamples = [
        { offset: -1, fmt: 'yyyy/mm/dd' },
        { offset: +1, fmt: 'yyyy/mm/dd' },
        { offset: -1, fmt: 'm月d日(aaa)' },
        { offset: +1, fmt: 'm月d日(aaa)' },
      ];
      const workdayHtml = `<div class="var-group">
        <div class="var-keyword">workday</div>
        <div class="var-desc">営業日（土日スキップ）</div>
        <div class="var-chips">${workdayExamples.map(({ offset, fmt }) => {
          const tag = `[workday(${offset > 0 ? '+' + offset : offset}, ${fmt})]`;
          const preview = formatDate(getWorkday(dm.today, offset), fmt);
          return `<span class="var-chip" onclick="insertPlaceholder('${tag.replace(/'/g, "\\'")}')" title="${tag}">${tag}<span class="var-chip-preview">${preview}</span></span>`;
        }).join('')}</div>
      </div>`;

      const groupsHtml = workdayHtml + VAR_GROUPS.map(({ keyword, desc, examples }) => {
        const chipsHtml = examples.map(fmt => {
          const preview = formatDate(dm[keyword], fmt);
          const tag = `[${keyword}(${fmt})]`;
          return `<span class="var-chip" onclick="insertPlaceholder('${tag.replace(/'/g, "\\'")}')" title="${tag}">
            ${tag}<span class="var-chip-preview">${preview}</span>
          </span>`;
        }).join('');
        return `<div class="var-group">
          <div class="var-keyword">${keyword}</div>
          <div class="var-desc">${desc}</div>
          <div class="var-chips">${chipsHtml}</div>
        </div>`;
      }).join('');

      const tokenRowsHtml = TOKENS.map(([k, v]) =>
        `<span class="token-key">${k}</span><span class="token-val">${v}</span>`
      ).join('');

      container.innerHTML = groupsHtml + `
        <div class="token-section">
          <div class="token-section-label">フォーマットトークン</div>
          <div class="token-grid">${tokenRowsHtml}</div>
        </div>`;
    }

    let lastFocused = null;
    let customParams = [];

    function addCustomParam() {
      const key = document.getElementById('param-key').value.trim();
      const val = document.getElementById('param-val').value;
      if (!key) return;
      customParams = customParams.filter(p => p.key !== key);
      customParams.push({ key, val });
      document.getElementById('param-key').value = '';
      document.getElementById('param-val').value = '';
      renderCustomParams();
      updateUrl();
    }

    function removeCustomParam(i) {
      customParams.splice(i, 1);
      renderCustomParams();
      updateUrl();
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderCustomParams() {
      const list = document.getElementById('custom-params-list');
      if (!list) return;
      list.innerHTML = customParams.map((p, i) => `
        <div class="custom-param-item">
          <span class="var-chip" onclick="insertPlaceholder('[param:${escHtml(p.key)}]')">[param:${escHtml(p.key)}]</span>
          <span class="custom-param-arrow">→</span>
          <span class="custom-param-val">${p.val ? escHtml(p.val) : '<span style="color:#c8d0e4">空</span>'}</span>
          <button class="custom-param-del" onclick="removeCustomParam(${i})">×</button>
        </div>`).join('');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.activeElement.id === 'param-val') addCustomParam();
    });

    function trackFocus() {
      ['f-to', 'f-cc', 'f-bcc', 'f-subject', 'f-body'].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('focus', () => { lastFocused = el; });
        el.addEventListener('input', updateUrl);
      });
    }

    function insertPlaceholder(text) {
      const el = lastFocused || document.getElementById('f-subject');
      el.focus();
      const start = el.selectionStart ?? el.value.length;
      const end   = el.selectionEnd   ?? el.value.length;
      el.value = el.value.slice(0, start) + text + el.value.slice(end);
      el.selectionStart = el.selectionEnd = start + text.length;
      updateUrl();
    }

    function updateUrl() {
      const to      = document.getElementById('f-to').value.trim();
      const cc      = document.getElementById('f-cc').value.trim();
      const bcc     = document.getElementById('f-bcc').value.trim();
      const subject = document.getElementById('f-subject').value.trim();
      const body    = document.getElementById('f-body').value;

      const urlEl = document.getElementById('generated-url');

      if (!to && !cc && !bcc && !subject && !body.trim()) {
        urlEl.textContent = '入力するとリンクが自動生成されます';
        urlEl.classList.add('empty');
        return;
      }

      const base = location.origin + location.pathname;
      const parts = [];
      if (to)          parts.push('to='      + encodeQueryValue(to));
      if (cc)          parts.push('cc='      + encodeQueryValue(cc));
      if (bcc)         parts.push('bcc='     + encodeQueryValue(bcc));
      if (subject)     parts.push('subject=' + encodeQueryValue(subject));
      if (body.trim()) parts.push('body='    + encodeQueryValue(body));
      customParams.forEach(({ key, val }) => {
        if (key) parts.push(encodeQueryValue(key) + '=' + encodeQueryValue(val));
      });

      urlEl.textContent = base + '?' + parts.join('&');
      urlEl.classList.remove('empty');
    }

    function copyUrl() {
      const urlEl = document.getElementById('generated-url');
      if (urlEl.classList.contains('empty')) return;
      navigator.clipboard.writeText(urlEl.textContent).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = 'コピーしました';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'コピー';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    function restoreFromLink() {
      const val = document.getElementById('restore-input').value.trim();
      if (!val) return;

      let to = '', cc = '', bcc = '', subject = '', body = '';

      if (val.startsWith('mailto:')) {
        const withoutScheme = val.slice(7);
        const qIdx = withoutScheme.indexOf('?');
        const toRaw = qIdx >= 0 ? withoutScheme.slice(0, qIdx) : withoutScheme;
        const queryStr = qIdx >= 0 ? withoutScheme.slice(qIdx + 1) : '';
        to = decodeURIComponent(toRaw);
        const p = new URLSearchParams(queryStr);
        cc      = p.get('cc')      ?? '';
        bcc     = p.get('bcc')     ?? '';
        subject = p.get('subject') ?? '';
        body    = p.get('body')    ?? '';
      } else {
        try {
          const url = new URL(val);
          const p = url.searchParams;
          to      = p.get('to')      ?? '';
          cc      = p.get('cc')      ?? '';
          bcc     = p.get('bcc')     ?? '';
          subject = p.get('subject') ?? '';
          body    = p.get('body')    ?? '';
          const reserved = new Set(['to','cc','bcc','subject','body']);
          customParams = [];
          p.forEach((v, k) => { if (!reserved.has(k)) customParams.push({ key: k, val: v }); });
          renderCustomParams();
        } catch (_) {
          return;
        }
      }

      document.getElementById('f-to').value      = to;
      document.getElementById('f-cc').value      = cc;
      document.getElementById('f-bcc').value     = bcc;
      document.getElementById('f-subject').value = subject;
      document.getElementById('f-body').value    = body;
      document.getElementById('restore-input').value = '';
      updateUrl();
    }

    document.getElementById('restore-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') restoreFromLink();
    });

    function runBuilderMode() {
      buildVarsPanel();
      trackFocus();
      document.getElementById('mode-builder').style.display = 'flex';
    }

    /* ── Entry point ─────────────────────────────────────────── */

    (function () {
      const params = new URLSearchParams(location.search);
      const hasParams = params.has('to') || params.has('cc') || params.has('bcc')
        || params.has('subject') || params.has('body');

      if (hasParams) {
        runRedirectMode(params);
      } else {
        runBuilderMode();
      }
    })();
  </script>
</body>
</html>
